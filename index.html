<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVU Lizenz-Cockpit</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>

<body>

<div class="container">

    <h1>🏐 TVU Lizenz-Cockpit</h1>
    <p class="subtitle">
        Vergleich zwischen Mitgliederverwaltung und SHV-Lizenzen
    </p>

    <div class="card">

        <label>Mitgliederverwaltung</label>
        <input type="file" id="membersFile" accept=".xlsx,.xls">

        <label>Lizenzen</label>
        <input type="file" id="licensesFile" accept=".xlsx,.xls">

        <button id="compareBtn">
            Vergleichen
        </button>

    </div>

    <div class="status">

        <div>
            Mitglieder:
            <span id="memberCount">0</span>
        </div>

        <div>
            Lizenzen:
            <span id="licenseCount">0</span>
        </div>

    </div>

</div>

<script src="js/utils.js"></script>
<script src="js/excel.js"></script>
<script src="js/compare.js"></script>
<script src="js/app.js"></script>

</body>
</html>
