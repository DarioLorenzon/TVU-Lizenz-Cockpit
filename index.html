<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TVU Lizenz-Cockpit</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

</head>

<body>

    <div class="container">

        <h1>🏐 TVU Lizenz-Cockpit</h1>

        <p class="subtitle">
            Vergleich zwischen Mitgliederverwaltung und SHV-Lizenzen
        </p>

        <!-- ==========================================
             Dateien auswählen
        =========================================== -->

        <div class="card">

            <label for="membersFile">
                Mitgliederverwaltung
            </label>

            <input
                type="file"
                id="membersFile"
                accept=".xlsx,.xls">

            <label for="archiveFile">
                Archivierte Mitglieder
            </label>

            <input
                type="file"
                id="archiveFile"
                accept=".xlsx,.xls">

            <label for="licensesFile">
                SHV-Lizenzen
            </label>

            <input
                type="file"
                id="licensesFile"
                accept=".xlsx,.xls">

            <div class="buttonBar">

                <button id="compareBtn">
                    🔍 Vergleichen
                </button>

                <button
                    id="exportBtn"
                    style="display:none">

                    📤 Excel-Bericht erstellen

                </button>

            </div>

        </div>

        <!-- ==========================================
             Status
        =========================================== -->

        <div class="status">

            <div>

                Mitglieder

                <span id="memberCount">0</span>

            </div>

            <div>

                Archiv

                <span id="archiveCount">0</span>

            </div>

            <div>

                Lizenzen

                <span id="licenseCount">0</span>

            </div>

        </div>

        <!-- ==========================================
             Dashboard
        =========================================== -->

        <div class="dashboard">

            <div class="tile">

                <div class="tileTitle">
                    ✅ Keine Aktion
                </div>

                <div
                    class="tileValue"
                    id="countFound">

                    0

                </div>

            </div>

            <div class="tile">

                <div class="tileTitle">
                    ➕ Lizenz erstellen
                </div>

                <div
                    class="tileValue"
                    id="countCreate">

                    0

                </div>

            </div>

            <div class="tile">

                <div class="tileTitle">
                    ❌ Lizenz löschen
                </div>

                <div
                    class="tileValue"
                    id="countDelete">

                    0

                </div>

            </div>

            <div class="tile">

                <div class="tileTitle">
                    ⚠️ Abklären
                </div>

                <div
                    class="tileValue"
                    id="countReview">

                    0

                </div>

            </div>

        </div>

        <!-- ==========================================
             Statusmeldung
        =========================================== -->

        <div
            id="messageBox"
            class="results"
            style="display:none;">

            <p id="messageText"></p>

        </div>

        <!-- ==========================================
             Version
        =========================================== -->

        <footer class="footer">

            TVU Lizenz-Cockpit · Version 1.5.0

        </footer>

    </div>

    <!-- ==========================================
         JavaScript
    =========================================== -->

    <script src="js/utils.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/excel.js"></script>
    <script src="js/compare.js"></script>
    <script src="js/export.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
